name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tag push matching v* (e.g., v0.1.0, v1.0.0)

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            target: bun-linux-x64
            asset_name: telesend-linux-x64
          - os: linux
            arch: arm64
            target: bun-linux-arm64
            asset_name: telesend-linux-arm64
          - os: darwin
            arch: x64
            target: bun-darwin-x64
            asset_name: telesend-darwin-x64
          - os: darwin
            arch: arm64
            target: bun-darwin-arm64
            asset_name: telesend-darwin-arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package.json version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$pkg" ]; then
            echo "package.json version ($pkg) does not match git tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi

      - name: Build binary
        # Compile the TypeScript entrypoint into a standalone executable for the target platform
        run: bun build --compile --minify --target=${{ matrix.target }} --outfile dist/${{ matrix.asset_name }} src/index.ts

      - name: Verify compiled binary version
        if: matrix.target == 'bun-linux-x64'
        run: |
          printed="$(./dist/${{ matrix.asset_name }} -V)"
          pkg="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$printed" != "$pkg" ]; then
            echo "compiled -V ($printed) does not match package.json ($pkg)" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 1 # Short retention since it is only needed for the release job

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating a GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full commit history to generate the changelog properly

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # Consolidate all matrix artifacts into the same directory

      - name: Generate release notes
        run: |
          # Find the previous tag, or use the first commit if this is the first release
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          # Generate the changelog from git commits
          CHANGELOG=$(git log --pretty=format:'- %s (%h)' $PREVIOUS_TAG..HEAD)
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release"
          fi
          
          # Write changelog to a markdown file
          echo "### Changelog" > release_notes.md
          echo "" >> release_notes.md
          echo "$CHANGELOG" >> release_notes.md
          echo "" >> release_notes.md
          
          # Generate and append SHA256 checksums
          echo "### SHA256 Checksums" >> release_notes.md
          echo "" >> release_notes.md
          echo '```' >> release_notes.md
          cd artifacts && sha256sum telesend-* >> ../release_notes.md && cd ..
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: artifacts/telesend-*
          fail_on_unmatched_files: true
