name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tag push matching v* (e.g., v0.1.0, v1.0.0)

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            goos: linux
            goarch: amd64
            asset_name: telesend-linux-x64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
            asset_name: telesend-linux-arm64
          - os: darwin
            arch: x64
            goos: darwin
            goarch: amd64
            asset_name: telesend-darwin-x64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
            asset_name: telesend-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X 'github.com/dsnbyte/telesend/internal/version.Version=$tag'" -o dist/${{ matrix.asset_name }} ./cmd/telesend

      - name: Verify compiled binary version
        if: matrix.asset_name == 'telesend-linux-x64'
        run: |
          chmod +x dist/${{ matrix.asset_name }}
          ./dist/${{ matrix.asset_name }} -V

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CHANGELOG=$(git log --pretty=format:'- %s (%h)' $PREVIOUS_TAG..HEAD)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release"
          fi
          echo "### Changelog" > release_notes.md
          echo "" >> release_notes.md
          echo "$CHANGELOG" >> release_notes.md
          echo "" >> release_notes.md
          echo "### SHA256 Checksums" >> release_notes.md
          echo "" >> release_notes.md
          echo '```' >> release_notes.md
          cd artifacts && sha256sum telesend-* >> ../release_notes.md && cd ..
          echo '```' >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: artifacts/telesend-*
          fail_on_unmatched_files: true
